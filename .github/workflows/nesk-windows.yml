# Windows build of the Nesk Drive client.
#
# Derived from the upstream main.yml, restricted to the Windows target and carrying the two
# differences a branded build needs: the OIDC registration is injected at configure time rather
# than stored in the source tree, and the installer identity is checked before publishing.
name: Nesk Drive (Windows)

on:
  push:
    branches:
      - 'nesk/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: nesk-windows-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: windows-cl-x86_64
    permissions:
      contents: read
    # Pinned rather than windows-latest: that label now resolves to an image where Craft cannot
    # find the Visual Studio 2022 toolchain its msvc2022 target expects, which breaks the upstream
    # workflow too. Revisit when the Craft target moves to a newer compiler.
    runs-on: windows-2022

    env:
      CRAFT_TARGET: windows-cl-msvc2022-x86_64
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The Craft blueprint does not read branding/OEM.cmake: it takes the product identity from
      # these variables and otherwise falls back to "owncloud". Getting this wrong is not cosmetic,
      # the packager keeps only bin/<ApplicationExecutable> and filters every other executable out,
      # so the installer would ship without the client at all.
      APPLICATION_EXECUTABLE: nesk-drive
      APPLICATION_SHORTNAME: nesk-drive

    steps:
      - name: Check out latest commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Restore cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/cache
          key: ${{ runner.os }}-windows-cl-msvc2022-x86_64

      - name: Report the available Visual Studio toolchains
        # Craft aborts with a bare "Unable to locate Visual Studio" when the runner image does not
        # carry the expected compiler. Listing what is actually installed turns that into a
        # diagnosable failure instead of a guessing game.
        continue-on-error: true
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -products * -format value -property catalog_productDisplayVersion
            & $vswhere -products * -format value -property installationPath
          } else {
            Write-Output "vswhere.exe not found on this image"
          }

      - name: Clone CraftMaster
        run: git clone --depth=1 https://invent.kde.org/kde/craftmaster.git "$env:HOME/craft/CraftMaster/CraftMaster"

      - name: Craft setup
        run: |
          New-Item -Path ~/cache -ItemType Directory -ErrorAction SilentlyContinue
          & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" --setup

      - name: Craft unshelve
        run: |
          & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --unshelve "${env:GITHUB_WORKSPACE}/.craft.shelf"

      - name: Prepare
        run: |
          New-Item -ItemType Directory "${env:GITHUB_WORKSPACE}/binaries/"
          & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set forceAsserts=true owncloud/owncloud-client
          & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set srcDir="${env:GITHUB_WORKSPACE}" owncloud/owncloud-client
          & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c dev-utils/nsis

      - name: Install dependencies
        run: |
          & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --install-deps owncloud/owncloud-client

      - name: Build
        env:
          NESK_CLIENT_ID: ${{ secrets.NESK_OIDC_CLIENT_ID }}
          NESK_CLIENT_SECRET: ${{ secrets.NESK_OIDC_CLIENT_SECRET }}
        run: |
          # The OIDC registration is passed to CMake here instead of living in the public source.
          # When the secrets are missing (a pull request from a fork, or before they are configured)
          # the build falls back to the development placeholders of branding/OEM.cmake: the client
          # then builds and installs normally but cannot sign in, which is the safe outcome.
          $clientId = if ($env:NESK_CLIENT_ID) { $env:NESK_CLIENT_ID } else { "nesk-drive-dev-placeholder" }
          $clientSecret = if ($env:NESK_CLIENT_SECRET) { $env:NESK_CLIENT_SECRET } else { "nesk-drive-dev-placeholder-secret" }
          if (-not $env:NESK_CLIENT_ID) {
            Write-Output "::warning::No OIDC registration configured, building with development placeholders: sign in will fail."
          }
          & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set args="-DNESK_OAUTH_CLIENT_ID=$clientId -DNESK_OAUTH_CLIENT_SECRET=$clientSecret" owncloud/owncloud-client
          & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache owncloud/owncloud-client

      - name: Run tests
        run: |
          & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache --test --options '[Compile]Jobs=1' owncloud/owncloud-client

      - name: Give the packager the product identity
        run: |
          # ApplicationExecutable and ApplicationShortname cover the file names, but the blueprint
          # also carries three literals that no variable can reach: the shortcut name, its
          # description and the publisher shown in Add/Remove Programs. Patch them here rather than
          # forking the blueprint, and fail loudly if upstream changes them, so this never silently
          # degrades back to ownCloud branding.
          $blueprint = Get-ChildItem "D:\craft" -Recurse -Filter "owncloud-client.py" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "craft-blueprints-owncloud" } | Select-Object -First 1
          if (-not $blueprint) {
            throw "Could not find the owncloud-client blueprint to brand"
          }
          Write-Output "Blueprint: $($blueprint.FullName)"

          $content = Get-Content $blueprint.FullName -Raw
          $replacements = @(
            @{ old = 'self.description = "ownCloud Desktop Client"'; new = 'self.description = "Nesk Drive"' },
            @{ old = 'self.displayName = "ownCloud"'; new = 'self.displayName = "Nesk Drive"' },
            @{ old = 'self.defines["company"] = "ownCloud GmbH"'; new = 'self.defines["company"] = "Neskapp"' }
          )
          foreach ($r in $replacements) {
            if (-not $content.Contains($r.old)) {
              throw "Blueprint no longer contains: $($r.old). Review the upstream blueprint before shipping."
            }
            $content = $content.Replace($r.old, $r.new)
          }
          Set-Content -Path $blueprint.FullName -Value $content -NoNewline
          Write-Output "Applied $($replacements.Count) branding replacements"

      - name: Make the branded icon visible to the installer script
        run: |
          # The upstream Craft blueprint generates an NSIS script that hardcodes src/gui/owncloud.ico,
          # while ecm_add_app_icon names the icon after APPLICATION_ICON_NAME, so a branded build
          # produces nesk-drive.ico and packaging aborts. Copy rather than rename, so anything else
          # looking for the branded name still finds it.
          $buildDir = (& "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --get buildDir -q owncloud-client | Where-Object { $_ -and $_.Trim() } | Select-Object -Last 1).Trim()
          Write-Output "Build directory: $buildDir"
          $guiDir = Join-Path $buildDir "src/gui"
          $expected = Join-Path $guiDir "owncloud.ico"
          if (Test-Path $expected) {
            Write-Output "owncloud.ico is already present, nothing to do"
          } else {
            $icons = @(Get-ChildItem $guiDir -Filter "*.ico" -ErrorAction SilentlyContinue)
            if ($icons.Count -eq 0) {
              throw "No .ico was produced in $guiDir, the branded icon sources are probably missing"
            }
            Copy-Item $icons[0].FullName $expected
            Write-Output "Copied $($icons[0].Name) to owncloud.ico for the installer script"
          }

      - name: Package
        run: |
          & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache --package owncloud/owncloud-client

      - name: Prepare artifacts
        run: |
          Copy-Item "$env:HOME/craft/binaries/*" "${env:GITHUB_WORKSPACE}/binaries/" -ErrorAction SilentlyContinue
          # Craft records the configure arguments, OIDC registration included, in its package
          # manifest. That file has no value for whoever installs the client and must never be
          # published: it would put the client secret in plain text in a downloadable artifact.
          Remove-Item "${env:GITHUB_WORKSPACE}/binaries/manifest*.json" -Force -ErrorAction SilentlyContinue
          Get-ChildItem "${env:GITHUB_WORKSPACE}/binaries/" | Format-Table Name, Length

      - name: Make sure no published file leaks the registration
        env:
          NESK_CLIENT_SECRET: ${{ secrets.NESK_OIDC_CLIENT_SECRET }}
        run: |
          # The compiled client necessarily embeds its own registration, that is the nature of a
          # public native client. Everything else we publish must be free of it.
          if (-not $env:NESK_CLIENT_SECRET) {
            Write-Output "No registration configured, nothing to check"
            exit 0
          }
          $suspect = @(Get-ChildItem "${env:GITHUB_WORKSPACE}/binaries/" -File |
            Where-Object { $_.Extension -in @(".json", ".txt", ".sha256", ".nsi", ".log") })
          foreach ($file in $suspect) {
            if (Select-String -Path $file.FullName -Pattern $env:NESK_CLIENT_SECRET -SimpleMatch -Quiet) {
              throw "$($file.Name) contains the client secret and must not be published"
            }
          }
          Write-Output "Checked $($suspect.Count) text files, none carries the registration"

      - name: Check the installer identity
        run: |
          # The installer file name comes from the Craft blueprint and carries the branch name, so it
          # says nothing about the branding. What matters is the executable inside: it is named after
          # APPLICATION_EXECUTABLE, so finding nesk-drive.exe proves the OEM theme was picked up.
          $installers = @(Get-ChildItem "${env:GITHUB_WORKSPACE}/binaries/" -Filter "*.exe" -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) {
            throw "No Windows installer was produced"
          }
          Write-Output "Installer: $($installers.Name -join ', ')"

          $buildDir = (& "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --get buildDir -q owncloud-client | Where-Object { $_ -and $_.Trim() } | Select-Object -Last 1).Trim()
          $client = @(Get-ChildItem (Join-Path $buildDir "bin") -Filter "nesk-drive.exe" -Recurse -ErrorAction SilentlyContinue)
          if ($client.Count -eq 0) {
            $found = @(Get-ChildItem (Join-Path $buildDir "bin") -Filter "*.exe" -ErrorAction SilentlyContinue)
            throw "The build produced no nesk-drive.exe, so the branding did not apply. Found: $($found.Name -join ', ')"
          }
          Write-Output "Branded executable: $($client[0].FullName)"

          # Building the client is not enough: the packager filters executables by name, and a
          # mismatch there produced an installer with no client in it at all. Verify the payload we
          # are about to publish actually carries it.
          $archive = @(Get-ChildItem "${env:GITHUB_WORKSPACE}/binaries/" -Filter "*.7z" -ErrorAction SilentlyContinue)
          if ($archive.Count -eq 0) {
            throw "No package archive was produced"
          }
          $sevenZip = Get-ChildItem "D:\craft" -Recurse -Filter "7za.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sevenZip) {
            throw "Could not find 7za.exe to inspect the package"
          }
          $listing = & $sevenZip.FullName l $archive[0].FullName
          $executables = @($listing | Select-String -Pattern "\.exe$" -AllMatches)
          Write-Output "Executables in the package:"
          $executables | ForEach-Object { Write-Output "  $_" }
          if (-not ($listing | Select-String -Pattern "nesk-drive\.exe" -Quiet)) {
            throw "The package contains no nesk-drive.exe: the installer would have nothing to launch"
          }
          Write-Output "The package carries the client executable"

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nesk-drive-windows-unsigned
          path: ${{ github.workspace }}/binaries/*
